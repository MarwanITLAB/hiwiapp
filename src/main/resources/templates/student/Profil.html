<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mein Profil | HiwiApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: #212529; }
        .profile-card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .avatar-circle {
            width: 100px;
            height: 100px;
            background-color: #ffc107;
            color: #212529;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 2.5rem;
            margin: 0 auto 20px auto;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm mb-4">
    <div class="container-fluid px-4">
        <span class="navbar-brand fw-bold text-info">HIWI<span class="text-white">APP</span></span>
        <a th:href="@{/student/dashboard}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Zum Dashboard
        </a>
    </div>
</nav>

<main class="container" style="max-width: 600px;">
    <div class="card profile-card shadow p-4 text-center bg-white">

        <div class="avatar-circle shadow-sm">
            <i class="bi bi-person-fill"></i>
        </div>

        <h3 class="fw-bold mb-1" th:text="${user.vorname + ' ' + user.nachname}">Max Mustermann</h3>
        <p class="text-muted small mb-4">Studentische Hilfskraft</p>

        <hr>

        <div class="text-start mt-3">
            <h5 class="fw-bold text-primary mb-3"><i class="bi bi-card-text me-2"></i>Persönliche Daten & Vertrag</h5>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="text-muted small d-block">Benutzername</label>
                    <span class="fw-semibold fs-5" th:text="${user.username}">max.mustermann</span>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="text-muted small d-block">E-Mail-Adresse</label>
                    <span class="fw-semibold fs-5" th:text="${user.email != null and !user.email.isEmpty() ? user.email : 'Keine E-Mail hinterlegt'}">max@uni-beispiel.de</span>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="text-muted small d-block">Telefon</label>
                    <span class="fw-semibold fs-5" th:text="${user.telefon != null and !user.telefon.isEmpty() ? user.telefon : 'Nicht hinterlegt'}">-</span>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="text-muted small d-block">Geburtsdatum</label>
                    <span class="fw-semibold fs-5" th:text="${user.geburtsdatum != null ? #temporals.format(user.geburtsdatum, 'dd.MM.yyyy') : 'Nicht hinterlegt'}">-</span>
                </div>
            </div>

            <div class="mb-3">
                <label class="text-muted small d-block">Anschrift</label>
                <span class="fw-semibold fs-5" th:text="${user.anschrift != null and !user.anschrift.isEmpty() ? user.anschrift : 'Keine Anschrift hinterlegt'}">-</span>
            </div>

            <hr>

            <div class="mb-3">
                <label class="text-muted small d-block">Standard-Sollstunden (Vertrag)</label>
                <span class="badge bg-primary fs-6" th:text="${user.sollStunden != null ? user.sollStunden + ' Std. / Monat' : 'Nicht definiert'}">40 Std. / Monat</span>
                <p class="text-muted mt-1 mb-0" style="font-size: 0.8rem;">
                    <i class="bi bi-info-circle me-1"></i>Hinweis: Dein Betreuer kann diese Stunden in der Jahresübersicht für einzelne Monate anpassen.
                </p>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
