<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Neuen Hiwi anlegen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">

<div class="container bg-white p-4 shadow-sm rounded" style="max-width: 500px;">
  <h2 class="text-primary mb-4">Neuen Account erstellen</h2>

  <form th:action="@{/register}" method="post">

    <div class="mb-3">
      <label class="form-label">Benutzername</label>
      <input type="text" name="username" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">E-Mail Adresse</label>
      <input type="email" name="email" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Passwort</label>
      <input type="password" name="password" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Rolle zuweisen</label>
      <select name="role" class="form-select">
        <option value="STUDENT">Student (Hiwi)</option>
        <option value="BETREUER">Betreuer</option>
        <option value="ADMIN">Administrator</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success w-100">Account Speichern</button>
  </form>
</div>

</body>
</html>
