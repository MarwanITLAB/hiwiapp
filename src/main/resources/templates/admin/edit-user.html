<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Benutzer bearbeiten</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 shadow-sm rounded" style="max-width: 500px;">
  <h2 class="text-primary mb-3">Benutzer bearbeiten</h2>

  <form th:action="@{'/admin/users/edit/' + ${user.id}}" method="post">
    <div class="mb-3">
      <label>Benutzername</label>
      <input type="text" name="username" class="form-control" th:value="${user.username}" required>
    </div>
    <div class="mb-3">
      <label>E-Mail</label>
      <input type="email" name="email" class="form-control" th:value="${user.email}" required>
    </div>
    <div class="mb-3">
      <label>Passwort (nur ändern, wenn nötig)</label>
      <input type="password" name="password" class="form-control">
    </div>
    <div class="mb-3">
      <label>Rolle</label>
      <select name="role" class="form-select">
        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r} == ${user.role}"></option>
      </select>
    </div>
    <button type="submit" class="btn btn-success w-100">Änderungen speichern</button>
  </form>

  <a th:href="@{/admin/users}" class="btn btn-secondary w-100 mt-2">Abbrechen</a>
</div>

</body>
</html>
