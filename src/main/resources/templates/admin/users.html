<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>System-Einstellungen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 shadow-sm rounded">
  <h2 class="text-danger mb-3">System-Einstellungen</h2>
  <p class="text-muted">Verwalte Benutzerkonten, Rollen und globale Projekteinstellungen.</p>

  <hr>
  <h4>Alle Benutzer</h4>
  <table class="table table-striped mt-3">
    <thead>
    <tr>
      <th>Benutzername</th>
      <th>E-Mail</th>
      <th>Rolle</th>
      <th>Aktionen</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
      <td th:text="${user.username}"></td>
      <td th:text="${user.email}"></td>
      <td th:text="${user.role}"></td>
      <td>
        <a th:href="@{'/admin/users/edit/' + ${user.id}}" class="btn btn-warning btn-sm">Bearbeiten</a>
        <form th:action="@{'/admin/users/delete/' + ${user.id}}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-danger btn-sm">Löschen</button>
        </form>
      </td>
    </tr>
    </tbody>

  </table>

  <hr>
  <h4>Neuen Benutzer anlegen</h4>
  <form th:action="@{/admin/users}" method="post">
    <div class="mb-3">
      <label>Benutzername</label>
      <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>E-Mail</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Passwort</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>Rolle</label>
      <select name="role" class="form-select">
        <option value="STUDENT">Student</option>
        <option value="BETREUER">Betreuer</option>
        <option value="ADMIN">Administrator</option>
      </select>
    </div>
    <button type="submit" class="btn btn-success w-100">Account speichern</button>
  </form>
</div>

</body>
</html>
