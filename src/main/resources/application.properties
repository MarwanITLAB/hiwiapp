# 1. DATENBANK-EINSTELLUNGEN
# Speichert die Daten in einer Datei im Ordner "data" deines Projekts
spring.datasource.url=jdbc:h2:file:./data/hiwidb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 2. HIBERNATE / JPA EINSTELLUNGEN
# 'update' sorgt dafür, dass Spring die Tabellen (User, etc.) automatisch erstellt
spring.jpa.hibernate.ddl-auto=update
# Zeigt die SQL-Befehle in der Konsole an (hilfreich für Anfänger zum Lernen)
spring.jpa.show-sql=true

# 3. H2-KONSOLE (Die grafische Oberfläche)
# Damit du deine Datenbank im Browser anschauen kannst
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Erlaubt den Zugriff auf die Konsole auch innerhalb von HTML-Frames
spring.security.headers.frame-options=sameorigin

# 4. THYMELEAF
# Schaltet das Caching aus, damit Änderungen am HTML sofort sichtbar werden (ohne Neustart)
spring.thymeleaf.cache=false