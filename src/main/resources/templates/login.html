<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiwiApp | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --excel-border: #dee2e6;
            --excel-header: #f8f9fa;
            --admin-gray: #495057;
        }
        body {
            background-color: #f1f3f5; /* Das gleiche Grau wie die Dashboard-Sidebar */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 30px;
            border: 1px solid var(--excel-border);
            border-radius: 0; /* Eckig für den Tabellen-Look */
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .login-header {
            border-bottom: 2px solid var(--admin-gray);
            margin-bottom: 25px;
            padding-bottom: 10px;
        }
        .form-control {
            border-radius: 0; /* Eckige Inputs passen besser zu Excel-Zellen */
            border: 1px solid var(--excel-border);
        }
        .form-control:focus {
            border-color: var(--admin-gray);
            box-shadow: none;
        }
        .btn-login {
            background-color: var(--admin-gray);
            border-color: var(--admin-gray);
            color: white;
            border-radius: 0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-login:hover {
            background-color: #343a40;
            border-color: #343a40;
        }
        .alert {
            border-radius: 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header text-center">
        <h4 class="fw-bold mb-0" style="letter-spacing: 2px;">HIWI-VERWALTUNG</h4>
        <small class="text-muted">SYSTEM-ANMELDUNG</small>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> Zugangsdaten ungültig.
    </div>

    <div th:if="${param.blocked}" class="alert alert-danger py-2" role="alert">
        <i class="bi bi-shield-exclamation me-2"></i> Ihre Eingabe enthielt unerlaubte Zeichen (HTML-Code).
        Aus Sicherheitsgründen wurden Sie abgemeldet. Der Vorgang wurde protokolliert.
    </div>

    <div th:if="${param.logout}" class="alert alert-info py-2" role="alert">
        Sie wurden erfolgreich abgemeldet.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label small fw-bold">BENUTZERNAME</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Benutzerkennung" required autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label small fw-bold">PASSWORT</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="d-grid mt-4">
            <button type="submit" class="btn btn-login">Anmelden</button>
        </div>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
        <p class="text-muted small mb-0">HiwiApp v1.0 | 2026</p>
    </div>
</div>

</body>
</html>
