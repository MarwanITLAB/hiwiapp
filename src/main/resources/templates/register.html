<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8">
  <title>HiwiApp | Personalstamm anlegen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --excel-border: #dee2e6;
      --admin-gray: #495057;
    }
    body { background-color: #f1f3f5; font-family: 'Segoe UI', sans-serif; padding-top: 50px; }

    .admin-card {
      max-width: 600px;
      margin: auto;
      background: white;
      border: 1px solid var(--excel-border);
      padding: 0; /* Wir nutzen Header-Padding separat */
    }
    .card-header-excel {
      background-color: #e9ecef;
      border-bottom: 2px solid var(--admin-gray);
      padding: 15px 25px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .card-body { padding: 30px; }

    .form-label { font-weight: 600; font-size: 0.85rem; color: var(--admin-gray); }
    .form-control, .form-select {
      border-radius: 0;
      border: 1px solid var(--excel-border);
    }
    .form-control:focus { border-color: var(--admin-gray); box-shadow: none; }

    .btn-save {
      background-color: #2c3e50;
      color: white;
      border-radius: 0;
      font-weight: bold;
      padding: 10px;
    }
    .btn-save:hover { background-color: #1a252f; color: white; }
  </style>
</head>
<body>

<div class="admin-card">
  <div class="card-header-excel">
    <i class="bi bi-person-plus"></i> Neuer Personal-Datensatz
  </div>

  <div class="card-body">
    <form th:action="@{/register}" method="post">

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">BENUTZERNAME</label>
          <input type="text" name="username" class="form-control" placeholder="z.B. samy_r" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">PASSWORT</label>
          <input type="password" name="password" class="form-control" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">E-MAIL ADRESSE</label>
        <input type="email" name="email" class="form-control" placeholder="name@uni-beispiel.de" required>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">SYSTEM-ROLLE</label>
          <select name="role" class="form-select">
            <option value="STUDENT">Student (Hiwi)</option>
            <option value="BETREUER">Betreuer</option>
            <option value="ADMIN">Administrator</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">SOLL-STUNDEN / MONAT</label>
          <input type="number" step="0.5" name="sollStunden" class="form-control" placeholder="z.B. 30.0" required>
        </div>
      </div>

      <div class="mt-4 pt-3 border-top d-flex justify-content-between">
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm px-4" style="border-radius: 0;">Abbrechen</a>
        <button type="submit" class="btn btn-save px-5">Datensatz speichern</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
