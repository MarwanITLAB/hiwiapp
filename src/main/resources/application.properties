
# =====================================================================
#  HiwiApp – Konfiguration
#  Alles, was sich zwischen deinem PC und dem Server unterscheidet,
#  kommt aus UMGEBUNGSVARIABLEN. Schreibweise: ${VARIABLE:Standardwert}
#  -> Ohne Variable gilt der Standardwert (praktisch für IntelliJ lokal).
#  -> Auf dem Server setzt docker-compose die Variablen aus der Datei .env
# =====================================================================

# ---------- Datenbank (PostgreSQL) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:54325/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:meinpasswort}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Alte H2-Datenbank (nicht mehr benutzt)
# spring.datasource.url=jdbc:h2:file:./data/hiwidb;AUTO_SERVER=TRUE

spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}

# ---------- E-Mail (Gmail) ----------
# Gmail braucht ein APP-PASSWORT (nicht dein normales Google-Passwort):
# Google-Konto -> Sicherheit -> 2-Faktor aktivieren -> "App-Passwörter"
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Absenderadresse (bei Gmail = dein Gmail-Konto)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@hiwiapp.local}}

# ---------- Start-Benutzer ----------
# Test-Konten betreuer/student mit Passwort 123 – NUR lokal! Auf dem Server: false
app.demo-users=${APP_DEMO_USERS:true}
# Passwort für das erste Admin-Konto (nur beim allerersten Start benutzt).
# Leer = lokal "123" (wenn demo-users=true), sonst zufällig – steht dann im Log.
app.admin-password=${APP_ADMIN_PASSWORD:}

# ---------- Server ----------
server.port=${PORT:8080}
# Hinter einem Reverse-Proxy (nginx, Render, ...) die echten Adressen/HTTPS erkennen
server.forward-headers-strategy=framework
