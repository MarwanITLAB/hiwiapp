
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Betreuer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; }
        .card-menu { transition: transform 0.2s; cursor: pointer; text-decoration: none; color: inherit; }
        .card-menu:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">HIWIAPP | Betreuer</span>
    <form th:action="@{/logout}" method="post"><button class="btn btn-danger btn-sm">Abmelden</button></form>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Willkommen im Betreuer-Bereich</h2>
    <div class="row g-4">
        <div class="col-md-6">
            <a th:href="@{/betreuer/stunden}" class="card h-100 shadow-sm card-menu">
                <div class="card-body text-center p-5">
                    <i class="bi bi-table text-primary fs-1"></i>
                    <h3 class="mt-3">Stunden-Master</h3>
                    <p class="text-muted">Alle Hiwi-Stunden auf einen Blick einsehen.</p>
                </div>
            </a>
        </div>
        <div class="col-md-6">
            <a th:href="@{/betreuer/kontakte}" class="card h-100 shadow-sm card-menu">
                <div class="card-body text-center p-5">
                    <i class="bi bi-person-lines-fill text-success fs-1"></i>
                    <h3 class="mt-3">Kontaktliste</h3>
                    <p class="text-muted">Telefonnummern und E-Mails der Hiwis.</p>
                </div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
