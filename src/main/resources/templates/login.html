<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HiwiApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">HiwiApp</h2>
        <p class="text-muted">Bitte melden Sie sich an</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger" role="alert">
        Benutzername oder Passwort falsch.
    </div>

    <div th:if="${param.logout}" class="alert alert-success" role="alert">
        Erfolgreich abgemeldet.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Benutzername</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Dein Name" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Passwort</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Einloggen</button>
        </div>
    </form>

    <div class="text-center mt-3">
        <small class="text-muted">Noch keinen Account? Kontaktier dein Admin.</small>
    </div>
</div>

</body>
</html>
